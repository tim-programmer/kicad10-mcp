[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kicad10-mcp"
version = "0.1.0"
description = "Comprehensive Model Context Protocol (MCP) server for KiCad 10 (IPC API via kipy, kicad-cli, and S-expression schematic/library workflows)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "kicad-python>=0.8.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[project.scripts]
kicad10-mcp = "kicad_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kicad_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
